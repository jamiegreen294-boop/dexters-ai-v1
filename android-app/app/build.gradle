plugins { id 'com.android.application' }

def releaseStorePath = System.getenv("DEXTER_ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("DEXTER_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("DEXTER_ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("DEXTER_ANDROID_KEY_PASSWORD")

android {
    namespace 'uk.co.dextersspot.dexterai'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.co.dextersspot.dexterai'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '3.0-device-owner'
    }

    signingConfigs {
        if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
}
