plugins { id 'com.android.application' }

android {
    namespace 'uk.co.dextersspot.dexterai'
    compileSdk 35

    defaultConfig {
        applicationId 'uk.co.dextersspot.dexterai'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '7.0-local-adb-key-fix'
    }

    def ksPath = System.getenv('DEXTER_ANDROID_KEYSTORE_PATH')
    def ksPassword = System.getenv('DEXTER_ANDROID_KEYSTORE_PASSWORD')
    def ksAlias = System.getenv('DEXTER_ANDROID_KEY_ALIAS')
    def ksKeyPassword = System.getenv('DEXTER_ANDROID_KEY_PASSWORD')

    if (ksPath && ksPassword && ksAlias && ksKeyPassword) {
        signingConfigs {
            release {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
                minifyEnabled false
            }
        }
    }
}

dependencies {
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}
