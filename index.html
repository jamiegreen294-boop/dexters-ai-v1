<!doctype html>
<html><head><title>Dexter AI Command Centre v30</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#111;color:white;padding:20px}.card{background:#222;padding:15px;border-radius:12px;margin:12px 0}button{padding:10px;margin:4px;border-radius:8px}textarea,input,select{width:90%;padding:10px}.chat{background:#000;padding:12px;min-height:100px}</style></head><body>
<h1>🤖 Dexter AI Command Centre v30</h1><p>TEST ENVIRONMENT ONLY - LIVE CONNECTIONS LOCKED</p>
<div class="card"><h2>Memory & Learning Centre</h2><p>🟢 Test Memory System Online</p><input id="memory" placeholder="Approved response memory"><button onclick="saveMemory()">Save Memory</button><ul id="memories"></ul></div>
<div class="card"><h2>Response Library</h2><textarea id="reply" placeholder="Approved Dexter response"></textarea><button onclick="saveReply()">Add Response</button><ul id="replies"></ul></div>
<div class="card"><h2>Response Brain</h2><select id="mood"><option>Happy Customer</option><option>Question</option><option>Frustrated Customer</option><option>Complaint</option></select><select id="rule"><option>Customer Help</option><option>Order Question</option><option>Banter Mode</option><option>Complaint Handling</option><option>Escalation</option></select><input id="msg" placeholder="Customer message"><button onclick="run()">Test Dexter</button><div id="chat" class="chat">Ready.</div></div>
<div class="card"><h2>Personality Profiles</h2><button onclick="mode('Normal Dexter')">Normal</button><button onclick="mode('Cheeky Glasgow Dexter')">Cheeky Glasgow</button><button onclick="mode('Late Night Dexter')">Late Night</button><button onclick="mode('Customer Safe Dexter')">Safe</button><p id="current">Current: Normal Dexter</p></div>
<div class="card"><h2>Audit Log</h2><ul id="logs"></ul></div>
<script>let current='Normal Dexter';function log(x){logs.innerHTML+='<li>'+x+'</li>'}function mode(x){current=x;currentEl.innerText='Current: '+x;log('Personality selected: '+x)}function saveMemory(){if(memory.value){memories.innerHTML+='<li>'+memory.value+'</li>';log('Memory saved')}}function saveReply(){if(reply.value){replies.innerHTML+='<li>'+reply.value+'</li>';log('Response added')}}function run(){chat.innerHTML='Customer: '+msg.value+'<br>Mood: '+mood.value+'<br>Rule: '+rule.value+'<br>Dexter ('+current+'): Test response generated using memory and rules';log('Memory response test completed')}let currentEl=document.getElementById('current');</script></body></html>
