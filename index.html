<!doctype html>
<html><head><title>Dexter AI Command Centre v23</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#111;color:white;padding:20px}.card{background:#222;padding:15px;border-radius:12px;margin:12px 0}button{padding:10px;margin:4px;border-radius:8px}textarea,input,select{width:90%;padding:10px}.chat{background:#000;padding:12px;min-height:100px}</style></head><body>
<h1>🤖 Dexter AI Command Centre v23</h1><p>TEST ENVIRONMENT ONLY - LIVE CONNECTIONS LOCKED</p>
<div class="card"><h2>Core Engine</h2><p>🟢 Dexter Engine Test Online</p><p>🔒 Live systems disabled</p><p>Approval gate active</p></div>
<div class="card"><h2>Personality Profiles</h2><button onclick="mode('Normal Dexter')">Normal</button><button onclick="mode('Cheeky Glasgow Dexter')">Cheeky Glasgow</button><button onclick="mode('Late Night Dexter')">Late Night</button><button onclick="mode('Customer Safe Dexter')">Customer Safe</button><p id="current">Current: Normal Dexter</p></div>
<div class="card"><h2>Knowledge Manager</h2><select id="type"><option>Menu</option><option>Opening Times</option><option>Sunday Roast</option><option>Rewards</option><option>Allergens</option><option>Promotions</option></select><textarea id="data" placeholder="Add Dexter knowledge"></textarea><button onclick="save()">Save Knowledge</button><ul id="items"></ul></div>
<div class="card"><h2>Intent Tester</h2><input id="msg" placeholder="Customer message"><button onclick="test()">Analyse</button><div id="chat" class="chat">Ready.</div></div>
<div class="card"><h2>Engine Logs</h2><ul id="logs"></ul></div>
<script>let current='Normal Dexter';function log(t){logs.innerHTML+='<li>'+t+'</li>'}function mode(x){current=x;document.getElementById('current').innerText='Current: '+x;log('Profile selected: '+x)}function save(){if(data.value){items.innerHTML+='<li>'+type.value+': '+data.value+'</li>';log('Knowledge saved: '+type.value);data.value=''}}function test(){let m=msg.value.toLowerCase();let intent=m.includes('roast')?'Sunday Roast enquiry':m.includes('price')?'Price enquiry':m.includes('allerg')?'Allergen enquiry':'General question';chat.innerHTML+='\nCustomer: '+msg.value+'<br>Intent: '+intent+'<br>Dexter ('+current+'): Knowledge engine test complete';log('Intent analysed: '+intent)}</script></body></html>
