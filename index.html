<!doctype html>
<html><head><title>Dexter AI Command Centre v26</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#111;color:white;padding:20px}.card{background:#222;padding:15px;border-radius:12px;margin:12px 0}button{padding:10px;margin:4px;border-radius:8px}textarea,input,select{width:90%;padding:10px}.chat{background:#000;padding:12px;min-height:100px}</style></head><body>
<h1>🤖 Dexter AI Command Centre v26</h1><p>TEST ENVIRONMENT ONLY - LIVE CONNECTIONS LOCKED</p>
<div class="card"><h2>Admin Centre</h2><p>🔒 Owner approval required before live connections</p><button onclick="log('Security check completed')">Security Check</button></div>
<div class="card"><h2>Dexter Data Manager</h2><select id="category"><option>Menu</option><option>Opening Times</option><option>Sunday Roast</option><option>Rewards</option><option>Allergens</option><option>Promotions</option></select><textarea id="data" placeholder="Add Dexter information"></textarea><button onclick="saveData()">Save Data</button><ul id="items"></ul></div>
<div class="card"><h2>Conversation Lab</h2><select id="scenario"><option>Sunday Roast</option><option>Menu Question</option><option>Complaint</option><option>Rewards</option><option>Opening Times</option></select><input id="msg" placeholder="Customer message"><button onclick="run()">Run Test</button><div id="chat" class="chat">Ready.</div></div>
<div class="card"><h2>Personality Profiles</h2><button onclick="mode('Normal Dexter')">Normal</button><button onclick="mode('Cheeky Glasgow Dexter')">Cheeky Glasgow</button><button onclick="mode('Late Night Dexter')">Late Night</button><button onclick="mode('Customer Safe Dexter')">Safe</button><p id="current">Current: Normal Dexter</p></div>
<div class="card"><h2>Audit Log</h2><ul id="logs"></ul></div>
<script>let current='Normal Dexter';function log(x){logs.innerHTML+='<li>'+x+'</li>'}function mode(x){current=x;document.getElementById('current').innerText='Current: '+x;log('Personality changed: '+x)}function saveData(){if(data.value){items.innerHTML+='<li>'+category.value+': '+data.value+'</li>';log('Data saved: '+category.value);data.value=''}}function run(){chat.innerHTML='Scenario: '+scenario.value+'<br>Customer: '+msg.value+'<br>Dexter ('+current+'): Test response generated from data manager';log('Conversation tested: '+scenario.value)}</script></body></html>
