<!doctype html>
<html><head><title>Dexter AI Command Centre v20</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#111;color:white;padding:20px}.card{background:#222;padding:15px;border-radius:12px;margin:12px 0}button{padding:10px;margin:4px;border-radius:8px}textarea,input{width:90%;padding:10px}.chat{background:#000;padding:12px;min-height:100px}</style></head><body>
<h1>🤖 Dexter AI Command Centre v20</h1><p>TEST ENVIRONMENT ONLY - LIVE CONNECTIONS LOCKED</p>
<div class="card"><h2>Dashboard</h2><p>🟢 Dexter AI Test Mode Online</p><p>🔒 Live apps disabled</p><p>Approval gate active</p></div>
<div class="card"><h2>Personality Studio</h2><button onclick="mode('Normal Dexter')">Normal</button><button onclick="mode('Cheeky Glasgow Dexter')">Cheeky Glasgow</button><button onclick="mode('Late Night Dexter')">Late Night</button><button onclick="mode('Customer Safe')">Safe</button><p id="current">Current: Normal Dexter</p></div>
<div class="card"><h2>Dexter AI Engine Test</h2><input id="msg" placeholder="Customer message"><button onclick="test()">Run Test</button><div id="chat" class="chat">Ready for testing.</div></div>
<div class="card"><h2>Training & Rules</h2><textarea id="data" placeholder="Add training/rule data"></textarea><button onclick="save()">Save Test Data</button><ul id="items"></ul></div>
<div class="card"><h2>Audit Log</h2><ul id="logs"></ul></div>
<script>let current='Normal Dexter';function mode(x){current=x;document.getElementById('current').innerText='Current: '+x;logs.innerHTML+='<li>Personality changed: '+x+'</li>'}function save(){if(data.value){items.innerHTML+='<li>'+data.value+'</li>';logs.innerHTML+='<li>Test data saved</li>';data.value=''}}function test(){chat.innerHTML+='\nCustomer: '+msg.value+'\nDexter ('+current+'): Response engine test complete';logs.innerHTML+='<li>Response tested</li>'}</script></body></html>
