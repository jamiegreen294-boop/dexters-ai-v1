<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101010"><title>Dexter AI</title><style>
:root{font-family:Inter,system-ui,Arial;color:#f7f2e8;background:#0b0b0c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#47220f 0,#151110 34%,#090909 75%)}main{max-width:900px;margin:auto;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:18px}.top{display:flex;align-items:center;gap:12px;padding:10px 2px 18px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:#f18b22;color:#111;font-size:26px;font-weight:900}.top h1{margin:0;font-size:22px}.top p{margin:2px 0 0;color:#b9b2aa;font-size:13px}.status{margin-left:auto;font-size:12px;padding:7px 10px;border-radius:20px;background:#24201d;color:#d9d2ca}.chat{overflow:auto;padding:6px 0 110px}.bubble{max-width:82%;padding:13px 15px;margin:10px 0;border-radius:18px;line-height:1.45;white-space:pre-wrap}.assistant{background:#211f1e;border:1px solid #39332e;border-bottom-left-radius:5px}.user{background:#e77d18;color:#16100b;margin-left:auto;border-bottom-right-radius:5px}.composer{position:sticky;bottom:0;padding:12px;background:#151312;border:1px solid #332e2a;border-radius:20px;box-shadow:0 15px 45px #000;display:flex;gap:8px}textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:white;font:inherit;min-height:44px;max-height:130px;padding:11px}button{border:0;border-radius:14px;background:#ef841d;color:#17100a;font-weight:800;padding:0 19px;cursor:pointer}button:disabled{opacity:.5}.gate{position:fixed;inset:0;background:#090909ee;display:grid;place-items:center;padding:20px;z-index:5}.gate form{width:min(420px,100%);padding:26px;background:#191716;border:1px solid #39322d;border-radius:24px}.gate h2{margin-top:0}.gate input,.gate select{width:100%;margin:7px 0;padding:13px;border:1px solid #403831;border-radius:12px;background:#0f0e0d;color:white}.gate button{width:100%;height:46px;margin-top:8px}.small{font-size:12px;color:#aaa}.hidden{display:none}.error{color:#ffb0a3}@media(max-width:600px){main{padding:12px}.bubble{max-width:91%}}
</style></head><body><div id="gate" class="gate"><form id="login"><div class="logo">D</div><h2>Open Dexter AI</h2><p>Private assistant for Dexters.</p><input id="token" type="password" autocomplete="current-password" placeholder="Secure access code" required><select id="role"><option value="owner">Owner</option><option value="manager">Manager</option><option value="staff">Staff</option><option value="customer">Customer</option></select><button>Continue</button><p id="loginError" class="small error"></p></form></div><main><header class="top"><div class="logo">D</div><div><h1>Dexter AI</h1><p>Dexters business assistant</p></div><span id="status" class="status">Checking…</span></header><section id="chat" class="chat"><div class="bubble assistant">Awrite! I’m Dexter. Ask me about the menu, Sunday Roast, offers, procedures or a system problem.</div></section><form id="composer" class="composer"><textarea id="message" placeholder="Ask Dexter…" rows="1" required></textarea><button id="send">Send</button></form></main><script>
const $=s=>document.querySelector(s),chat=$("#chat"),msg=$("#message"),send=$("#send");let token=sessionStorage.dexterToken||"",role=sessionStorage.dexterRole||"owner",sessionId=localStorage.dexterSession||crypto.randomUUID();function bubble(text,who){const d=document.createElement("div");d.className="bubble "+who;d.textContent=text;chat.appendChild(d);scrollTo(0,document.body.scrollHeight);return d}async function check(){try{const r=await fetch("/api/health");const d=await r.json();$("#status").textContent=d.status==="ready"?"Online":"Setup needed"}catch{$("#status").textContent="Offline"}}$("#login").onsubmit=e=>{e.preventDefault();token=$("#token").value;role=$("#role").value;sessionStorage.dexterToken=token;sessionStorage.dexterRole=role;$("#gate").classList.add("hidden");msg.focus()};if(token){$("#gate").classList.add("hidden")}$("#composer").onsubmit=async e=>{e.preventDefault();const text=msg.value.trim();if(!text)return;msg.value="";bubble(text,"user");send.disabled=true;const wait=bubble("Thinking…","assistant");try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({message:text,sessionId,role})});const d=await r.json();if(r.status===401){sessionStorage.removeItem("dexterToken");$("#gate").classList.remove("hidden");throw new Error(d.error)}if(!r.ok)throw new Error(d.error||"Dexter is unavailable.");wait.textContent=d.reply;sessionId=d.sessionId;localStorage.dexterSession=sessionId}catch(err){wait.textContent=err.message}finally{send.disabled=false;msg.focus()}};msg.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#composer").requestSubmit()}};check();
</script></body></html>
