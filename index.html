<!doctype html>
<html><head><title>Dexter AI Command Centre v25</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#111;color:white;padding:20px}.card{background:#222;padding:15px;border-radius:12px;margin:12px 0}button{padding:10px;margin:4px;border-radius:8px}textarea,input,select{width:90%;padding:10px}.chat{background:#000;padding:12px;min-height:100px}</style></head><body>
<h1>🤖 Dexter AI Command Centre v25</h1><p>TEST ENVIRONMENT ONLY - LIVE CONNECTIONS LOCKED</p>
<div class="card"><h2>Admin Centre</h2><p>🔒 Owner approval required before any live connection</p><button onclick="log('Admin check completed')">Run Security Check</button></div>
<div class="card"><h2>Permissions</h2><select id="role"><option>Owner</option><option>Manager</option><option>Staff</option></select><button onclick="log('Permission tested: '+role.value)">Test Permission</button></div>
<div class="card"><h2>Conversation Lab</h2><select id="scenario"><option>Sunday Roast</option><option>Menu Question</option><option>Complaint</option><option>Rewards</option><option>Opening Times</option></select><input id="msg" placeholder="Customer message"><button onclick="run()">Run Test</button><div id="chat" class="chat">Ready.</div></div>
<div class="card"><h2>Personality Profiles</h2><button onclick="mode('Normal Dexter')">Normal</button><button onclick="mode('Cheeky Glasgow Dexter')">Cheeky Glasgow</button><button onclick="mode('Late Night Dexter')">Late Night</button><button onclick="mode('Customer Safe Dexter')">Safe</button><p id="current">Current: Normal Dexter</p></div>
<div class="card"><h2>Knowledge Manager</h2><textarea id="data" placeholder="Add knowledge"></textarea><button onclick="save()">Save Test Knowledge</button><ul id="items"></ul></div>
<div class="card"><h2>Audit Log</h2><ul id="logs"></ul></div>
<script>let current='Normal Dexter';function log(x){logs.innerHTML+='<li>'+x+'</li>'}function mode(x){current=x;document.getElementById('current').innerText='Current: '+x;log('Personality changed: '+x)}function save(){if(data.value){items.innerHTML+='<li>'+data.value+'</li>';log('Knowledge saved')}}function run(){chat.innerHTML='Scenario: '+scenario.value+'<br>Customer: '+msg.value+'<br>Dexter ('+current+'): Test response generated';log('Conversation tested: '+scenario.value)}</script></body></html>
