name: Deploy Dexter AI Test to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dexter-ai-test-vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_WWL2LfVdJc0U8F9QD29n6xXj
      VERCEL_PROJECT_ID: prj_jHa0ZVvB2Eu8eMqWBQkDgZFehuCA
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Vercel token
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN GitHub secret is missing"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy Dexter AI Test
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
