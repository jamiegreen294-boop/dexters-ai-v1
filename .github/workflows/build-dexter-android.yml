name: Build Dexter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/real-dexter-ai
      - build/dexter-os-mockup-exact
    paths:
      - 'android-app/**'
      - '.github/workflows/build-dexter-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dexter-OS-Meizu-v35
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish test APK to gh-pages device folder
        if: github.ref == 'refs/heads/build/dexter-os-mockup-exact'
        working-directory: .
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          mkdir -p /tmp/gh-pages/device
          cp android-app/app/build/outputs/apk/debug/app-debug.apk /tmp/gh-pages/device/Dexter-OS-Preview-v35.apk
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add device/Dexter-OS-Preview-v35.apk
          git commit -m "Publish Dexter OS Preview v35" || exit 0
          git push origin HEAD:gh-pages
