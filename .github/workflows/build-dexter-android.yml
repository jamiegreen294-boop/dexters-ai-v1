name: Build Dexter OS Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - dexter-os-preview
    paths:
      - 'android-app/**'
      - '.github/workflows/build-dexter-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore permanent Dexter signing keystore
        working-directory: .
        env:
          DEXTER_ANDROID_KEYSTORE_B64: ${{ secrets.DEXTER_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$DEXTER_ANDROID_KEYSTORE_B64"
          printf '%s' "$DEXTER_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dexter-business-phone.jks"

      - name: Build signed preview APK
        env:
          DEXTER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dexter-business-phone.jks
          DEXTER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DEXTER_ANDROID_KEYSTORE_PASSWORD }}
          DEXTER_ANDROID_KEY_ALIAS: ${{ secrets.DEXTER_ANDROID_KEY_ALIAS }}
          DEXTER_ANDROID_KEY_PASSWORD: ${{ secrets.DEXTER_ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dexter-OS-Preview-v25
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish isolated preview APK to GitHub Pages
        working-directory: .
        run: |
          git config user.name "Dexter Build"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add "$RUNNER_TEMP/gh-pages" origin/gh-pages
          mkdir -p "$RUNNER_TEMP/gh-pages/device"
          cp android-app/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/gh-pages/device/Dexter-OS-Preview-v25.apk"
          cd "$RUNNER_TEMP/gh-pages"
          git add device/Dexter-OS-Preview-v25.apk
          if git diff --cached --quiet; then
            echo "Dexter OS preview APK already current"
          else
            git commit -m "Publish Dexter OS Preview v25"
            git push origin HEAD:gh-pages
          fi
