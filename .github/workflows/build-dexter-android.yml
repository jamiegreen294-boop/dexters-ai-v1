name: Build Dexter OS Managed Phone APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/meizu-dexter-os-v45-manager-play-fix
    paths:
      - 'android-app/**'
      - '.github/workflows/build-dexter-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore permanent Dexter signing keystore
        working-directory: .
        env:
          DEXTER_ANDROID_KEYSTORE_B64: ${{ secrets.DEXTER_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$DEXTER_ANDROID_KEYSTORE_B64"
          printf '%s' "$DEXTER_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dexter-business-phone.jks"

      - name: Build signed managed APK
        env:
          DEXTER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dexter-business-phone.jks
          DEXTER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DEXTER_ANDROID_KEYSTORE_PASSWORD }}
          DEXTER_ANDROID_KEY_ALIAS: ${{ secrets.DEXTER_ANDROID_KEY_ALIAS }}
          DEXTER_ANDROID_KEY_PASSWORD: ${{ secrets.DEXTER_ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed managed artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dexter-Business-Phone-v45
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish immutable managed APK to GitHub Pages
        working-directory: .
        run: |
          git config user.name "Dexter Build"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add "$RUNNER_TEMP/gh-pages" origin/gh-pages
          mkdir -p "$RUNNER_TEMP/gh-pages/device"
          if [ -f "$RUNNER_TEMP/gh-pages/device/Dexter-Business-Phone-v44.apk" ] && [ ! -f "$RUNNER_TEMP/gh-pages/device/Dexter-Business-Phone-v44-rollback.apk" ]; then
            cp "$RUNNER_TEMP/gh-pages/device/Dexter-Business-Phone-v44.apk" "$RUNNER_TEMP/gh-pages/device/Dexter-Business-Phone-v44-rollback.apk"
          fi
          cp android-app/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/gh-pages/device/Dexter-Business-Phone-v45.apk"
          cp android-app/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/gh-pages/device/Dexter-Business-Phone-v44.apk"
          cd "$RUNNER_TEMP/gh-pages"
          git add device/Dexter-Business-Phone-v45.apk device/Dexter-Business-Phone-v44.apk device/Dexter-Business-Phone-v44-rollback.apk
          if git diff --cached --quiet; then
            echo "Dexter OS managed APK already current"
          else
            git commit -m "Publish Dexter Business Phone v45 manager Play fix"
            for attempt in 1 2 3; do
              if git push origin HEAD:gh-pages; then break; fi
              git fetch origin gh-pages
              git rebase origin/gh-pages
              if [ "$attempt" = "3" ]; then exit 1; fi
            done
          fi
