name: Build Dexter Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-dexter-android.yml'
  push:
    branches:
      - build/real-dexter-ai
      - upgrade/meizu-device-owner-v4-fix
    paths:
      - 'android-app/**'
      - '.github/workflows/build-dexter-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore permanent Dexter signing keystore
        working-directory: .
        env:
          DEXTER_ANDROID_KEYSTORE_B64: ${{ secrets.DEXTER_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$DEXTER_ANDROID_KEYSTORE_B64"
          printf '%s' "$DEXTER_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dexter-business-phone.jks"

      - name: Build signed release APK
        env:
          DEXTER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dexter-business-phone.jks
          DEXTER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DEXTER_ANDROID_KEYSTORE_PASSWORD }}
          DEXTER_ANDROID_KEY_ALIAS: ${{ secrets.DEXTER_ANDROID_KEY_ALIAS }}
          DEXTER_ANDROID_KEY_PASSWORD: ${{ secrets.DEXTER_ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Dexter-Business-Phone-v4
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
