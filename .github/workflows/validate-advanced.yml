name: Validate Dexter Advanced Test

on:
  push:
    branches:
      - upgrade/advanced-work-v3
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Home PC worker syntax
        run: node --check home-host/server.mjs
      - name: Check advanced UI syntax
        run: node --check advanced.js
