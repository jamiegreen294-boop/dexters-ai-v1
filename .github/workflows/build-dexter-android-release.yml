name: Build Dexter Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/real-dexter-ai
    paths:
      - 'android-app/**'
      - '.github/workflows/build-dexter-android-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.DEXTER_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.DEXTER_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DEXTER_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DEXTER_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEXTER_ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > dexter-business-phone-release.jks
          chmod 600 dexter-business-phone-release.jks

      - name: Build signed release APK
        env:
          DEXTER_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android-app/dexter-business-phone-release.jks
          DEXTER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DEXTER_ANDROID_KEYSTORE_PASSWORD }}
          DEXTER_ANDROID_KEY_ALIAS: ${{ secrets.DEXTER_ANDROID_KEY_ALIAS }}
          DEXTER_ANDROID_KEY_PASSWORD: ${{ secrets.DEXTER_ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Dexter-Business-Phone-Release
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error


      - name: Publish exact release APK to gh-pages
        working-directory: .
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk /tmp/Dexter-Business-Phone-Release.apk
          git config user.name "Dexter Android Release Publisher"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          mkdir -p downloads
          cp /tmp/Dexter-Business-Phone-Release.apk downloads/Dexter-Business-Phone-Release.apk
          git add downloads/Dexter-Business-Phone-Release.apk
          if git diff --cached --quiet; then
            echo "Published APK already matches."
          else
            git commit -m "Publish exact Dexter Business Phone release APK"
            git push origin gh-pages
          fi
