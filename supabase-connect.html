<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dexter Supabase Connect</title>
<style>
body{font-family:system-ui;background:#0b0b0b;color:#fff;max-width:700px;margin:40px auto;padding:20px}
.card{background:#151515;border:1px solid #333;border-radius:18px;padding:24px}
input,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0;border-radius:10px;border:1px solid #333;background:#171717;color:#fff}
button{background:#ef8b22;color:#111;font-weight:800;border:0}
small{color:#aaa} h1{margin-top:0}
</style>
</head>
<body>
<div class="card">
<h1>Connect Dexter to Supabase</h1>
<p>Enter the Supabase OAuth app details here. They are submitted directly over HTTPS to Dexter's secure backend and stored encrypted in Supabase Vault.</p>
<form method="post" action="https://eikruaxxzzxmfjvsmwwo.supabase.co/functions/v1/dexter-supabase-connect">
<label>Dexter owner access code</label>
<input name="owner_code" type="password" autocomplete="off" required>
<label>Supabase OAuth Client ID</label>
<input name="client_id" autocomplete="off" required>
<label>Supabase OAuth Client Secret</label>
<input name="client_secret" type="password" autocomplete="off" required>
<button type="submit">Securely connect Supabase</button>
</form>
<small>Do not paste the Client Secret into chat or GitHub.</small>
</div>
</body>
</html>
